name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create tar (exclude output file itself to avoid 'file changed' error)
      run: |
        tar -czf deploy_patch.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='./deploy_patch.tar.gz' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='storage/logs' \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='public_html/storage' \
          . || true
        # Verify the archive was actually created
        ls -lh deploy_patch.tar.gz

    - name: Upload tar to Hostinger via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        source: "deploy_patch.tar.gz"
        target: "/home/u664715641/"
        timeout: 120s
        strip_components: 0

    - name: Extract & Deploy on Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 300s
        script: |
          cd /home/u664715641

          # 1. DEPLOY KE DOMAIN UTAMA: pusatpiringkeramik.com
          if [ -d "domains/pusatpiringkeramik.com" ]; then
            echo "=== [1/2] Deploy ke pusatpiringkeramik.com ==="
            tar -xzf deploy_patch.tar.gz -C domains/pusatpiringkeramik.com/ 2>&1
            DEPLOY_MAIN="/home/u664715641/domains/pusatpiringkeramik.com"
            
            # Symlink storage
            rm -rf "$DEPLOY_MAIN/public_html/storage"
            ln -s "$DEPLOY_MAIN/storage/app/public" "$DEPLOY_MAIN/public_html/storage"
            chmod -R 775 "$DEPLOY_MAIN/storage" "$DEPLOY_MAIN/bootstrap/cache" 2>/dev/null || true
            
            cd "$DEPLOY_MAIN"
            php artisan migrate --force 2>&1 || true
            php artisan db:seed --class=CapGunungProductSeeder --force 2>&1 || true
            
            php artisan optimize:clear 2>&1 || true
            php artisan view:cache 2>&1 || true
            echo "--- pusatpiringkeramik.com OK!"
          fi

          # 2. DEPLOY KE SUBDOMAIN / STAGING: pusatpiringkeramik.hvmdigital.id
          if [ -d "domains/pusatpiringkeramik.hvmdigital.id" ]; then
            echo "=== [2/2] Deploy ke pusatpiringkeramik.hvmdigital.id ==="
            tar -xzf deploy_patch.tar.gz -C domains/pusatpiringkeramik.hvmdigital.id/ 2>&1
            DEPLOY_ALT="/home/u664715641/domains/pusatpiringkeramik.hvmdigital.id"
            
            # Symlink storage
            rm -rf "$DEPLOY_ALT/public_html/storage"
            ln -s "$DEPLOY_ALT/storage/app/public" "$DEPLOY_ALT/public_html/storage"
            chmod -R 775 "$DEPLOY_ALT/storage" "$DEPLOY_ALT/bootstrap/cache" 2>/dev/null || true
            
            cd "$DEPLOY_ALT"
            php artisan migrate --force 2>&1 || true
            php artisan db:seed --class=CapGunungProductSeeder --force 2>&1 || true
            
            php artisan optimize:clear 2>&1 || true
            php artisan view:cache 2>&1 || true
            echo "--- pusatpiringkeramik.hvmdigital.id OK!"
          fi

          # Bersihkan tar
          rm -f /home/u664715641/deploy_patch.tar.gz
          echo "=== SEMUA DEPLOY SELESAI DENGAN SUKSES ==="
