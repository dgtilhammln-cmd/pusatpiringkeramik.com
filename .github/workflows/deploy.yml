name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create tar (exclude output file itself to avoid 'file changed' error)
      run: |
        tar -czf deploy_patch.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='./deploy_patch.tar.gz' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='Cap Gunung' \
          --exclude='storage/logs' \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='public_html/storage' \
          . || true
        ls -lh deploy_patch.tar.gz

    - name: Upload tar to Hostinger via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        source: "deploy_patch.tar.gz"
        target: "/home/u664715641/"
        timeout: 120s
        strip_components: 0

    - name: Extract, Migrate, Seed & Clear Cache on Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 180s
        script: |
          set -e
          cd /home/u664715641

          # Target direktori yang ada di hosting
          TARGETS=()
          [ -d "domains/pusatpiringkeramik.com" ] && TARGETS+=("domains/pusatpiringkeramik.com")
          [ -d "domains/pusatpiringkeramik.hvmdigital.id" ] && TARGETS+=("domains/pusatpiringkeramik.hvmdigital.id")

          if [ ${#TARGETS[@]} -eq 0 ]; then
            echo "[WARN] Domain target tidak ditemukan, fallback ke domains/pusatpiringkeramik.hvmdigital.id"
            TARGETS+=("domains/pusatpiringkeramik.hvmdigital.id")
          fi

          for TARGET_DIR in "${TARGETS[@]}"; do
            echo "=============================================="
            echo ">>> Deploying to: $TARGET_DIR"
            echo "=============================================="
            mkdir -p "$TARGET_DIR"
            tar -xzf deploy_patch.tar.gz -C "$TARGET_DIR/" 2>&1

            # Fix symlink storage
            rm -rf "$TARGET_DIR/public_html/storage"
            mkdir -p "$TARGET_DIR/storage/app/public"
            ln -sf "$TARGET_DIR/storage/app/public" "$TARGET_DIR/public_html/storage"

            # Sync index.php dan .htaccess
            [ -f "$TARGET_DIR/public/index.php" ] && cp -f "$TARGET_DIR/public/index.php" "$TARGET_DIR/public_html/index.php"
            [ -f "$TARGET_DIR/public/.htaccess" ] && cp -f "$TARGET_DIR/public/.htaccess" "$TARGET_DIR/public_html/.htaccess"
            [ -f "$TARGET_DIR/public/robots.txt" ] && cp -f "$TARGET_DIR/public/robots.txt" "$TARGET_DIR/public_html/robots.txt"
            [ -f "$TARGET_DIR/public/llms.txt" ] && cp -f "$TARGET_DIR/public/llms.txt" "$TARGET_DIR/public_html/llms.txt"

            # Remove static sitemap so dynamic route works
            rm -f "$TARGET_DIR/public/sitemap.xml" "$TARGET_DIR/public_html/sitemap.xml" "$TARGET_DIR/public_html/sitemap.xsl"

            # Run artisan commands
            cd "/home/u664715641/$TARGET_DIR"
            php artisan migrate --force 2>&1
            php artisan db:seed --class=CapGunungProductSeeder --force 2>&1 || true
            php artisan optimize:clear 2>&1
            php artisan view:cache 2>&1
            cd /home/u664715641
          done

          rm -f deploy_patch.tar.gz
          echo "=============================================="
          echo ">>> DEPLOY & SEEDING BERHASIL DI SEMUA TARGET!"
          echo "=============================================="
