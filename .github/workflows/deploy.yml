name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create tar (exclude output file itself to avoid 'file changed' error)
      run: |
        tar -czf deploy_patch.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='./deploy_patch.tar.gz' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='storage/logs' \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='public_html/storage' \
          . || true
        # Verify the archive was actually created
        ls -lh deploy_patch.tar.gz

    - name: Upload tar to Hostinger via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        source: "deploy_patch.tar.gz"
        target: "/home/u664715641/"
        timeout: 120s
        strip_components: 0

    - name: Extract & Deploy on Server (pusatpiringkeramik.hvmdigital.id)
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 180s
        script: |
          set -e
          cd /home/u664715641

          # Extract ke folder web (tanpa menimpa .env dan vendor)
          tar -xzf deploy_patch.tar.gz -C domains/pusatpiringkeramik.hvmdigital.id/ 2>&1

          DEPLOY_DIR="/home/u664715641/domains/pusatpiringkeramik.hvmdigital.id"

          # Pastikan symlink storage selalu benar
          STORAGE_LINK="$DEPLOY_DIR/public_html/storage"
          STORAGE_TARGET="$DEPLOY_DIR/storage/app/public"
          rm -rf "$STORAGE_LINK"
          ln -s "$STORAGE_TARGET" "$STORAGE_LINK"
          echo "Storage symlink OK: $(ls -la $STORAGE_LINK)"

          cd "$DEPLOY_DIR"
          php artisan migrate --force 2>&1

          # Seed hero slides hanya jika tabel masih kosong
          SLIDE_COUNT=$(php artisan tinker --execute="echo \App\Models\HeroSlide::count();" 2>/dev/null | tail -1 || echo "0")
          if [ "$SLIDE_COUNT" = "0" ] || [ -z "$SLIDE_COUNT" ]; then
            echo "--- Hero slides kosong, menjalankan HeroSlideSeeder..."
            php artisan db:seed --class=HeroSlideSeeder --force 2>&1
          else
            echo "--- Hero slides sudah ada ($SLIDE_COUNT slide), skip seeder."
          fi

          # Seed Cap Gunung products (updateOrCreate = aman diulang)
          echo "--- Menjalankan CapGunungProductSeeder..."
          php artisan db:seed --class=CapGunungProductSeeder --force 2>&1
          PROD_COUNT=$(php artisan tinker --execute="echo \App\Models\Service::count();" 2>/dev/null | tail -1 || echo "?")
          echo "--- Total produk setelah seeding: $PROD_COUNT"

          php artisan optimize:clear 2>&1
          php artisan view:cache 2>&1

          echo "Deploy hvmdigital.id selesai!"

    - name: Copy to pusatpiringkeramik.com & run seeder
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 180s
        script: |
          set -e
          cd /home/u664715641

          # Cek apakah domain pusatpiringkeramik.com ada
          if [ -d "domains/pusatpiringkeramik.com" ]; then
            echo "--- Deploy ke pusatpiringkeramik.com..."
            tar -xzf deploy_patch.tar.gz -C domains/pusatpiringkeramik.com/ 2>&1 || true

            DEPLOY_DIR2="/home/u664715641/domains/pusatpiringkeramik.com"

            # Symlink storage
            STORAGE_LINK2="$DEPLOY_DIR2/public_html/storage"
            STORAGE_TARGET2="$DEPLOY_DIR2/storage/app/public"
            rm -rf "$STORAGE_LINK2"
            ln -s "$STORAGE_TARGET2" "$STORAGE_LINK2"
            echo "Storage symlink pusatpiringkeramik.com OK"

            cd "$DEPLOY_DIR2"
            php artisan migrate --force 2>&1 || true

            # Seed Cap Gunung products
            echo "--- Menjalankan CapGunungProductSeeder di pusatpiringkeramik.com..."
            php artisan db:seed --class=CapGunungProductSeeder --force 2>&1 || true
            PROD_COUNT2=$(php artisan tinker --execute="echo \App\Models\Service::count();" 2>/dev/null | tail -1 || echo "?")
            echo "--- Total produk pusatpiringkeramik.com: $PROD_COUNT2"

            php artisan optimize:clear 2>&1 || true
            echo "Deploy pusatpiringkeramik.com selesai!"
          else
            echo "--- Folder pusatpiringkeramik.com tidak ditemukan, skip."
          fi

          # Hapus tar setelah semua selesai
          rm -f /home/u664715641/deploy_patch.tar.gz
          echo "=== SEMUA DEPLOY SELESAI ==="
