name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Create tar (exclude output file itself to avoid 'file changed' error)
      run: |
        tar -czf deploy_patch.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='./deploy_patch.tar.gz' \
          --exclude='vendor' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='storage/logs' \
          --exclude='storage/framework/cache' \
          --exclude='storage/framework/sessions' \
          --exclude='storage/framework/views' \
          --exclude='public_html/storage' \
          . || true
        # Verify the archive was actually created
        ls -lh deploy_patch.tar.gz

    - name: Upload tar to Hostinger via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        source: "deploy_patch.tar.gz"
        target: "/home/u664715641/"
        timeout: 120s
        strip_components: 0

    - name: Extract, Migrate & Seed on Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        port: ${{ secrets.SSH_PORT }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        command_timeout: 300s
        script: |
          cd /home/u664715641

          for DIR in domains/pusatpiringkeramik.hvmdigital.id domains/pusatpiringkeramik.com; do
            if [ -d "$DIR" ]; then
              echo "=== Deploying to $DIR ==="
              tar -xzf deploy_patch.tar.gz -C "$DIR/" 2>&1 || true
              
              # Fix storage symlink
              rm -rf "$DIR/public_html/storage"
              ln -s "$DIR/storage/app/public" "$DIR/public_html/storage" 2>/dev/null || true
              chmod -R 775 "$DIR/storage" "$DIR/bootstrap/cache" 2>/dev/null || true
              
              cd "/home/u664715641/$DIR"
              php artisan migrate --force 2>&1 || true
              php artisan db:seed --class=CapGunungProductSeeder --force 2>&1 || true
              php artisan db:seed --class=KaibonProductSeeder --force 2>&1 || true
              php artisan optimize:clear 2>&1 || true
              php artisan view:cache 2>&1 || true
              cd /home/u664715641
              echo "=== $DIR OK ==="
            fi
          done

          rm -f deploy_patch.tar.gz
          echo "=== SEMUA DEPLOY SELESAI ==="
